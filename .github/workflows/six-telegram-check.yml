name: Six Telegram Sources Free Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/six-telegram-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check sources.mjs
          node --check scout.mjs
          node --check api/telegram.js
      - name: Check ~30 recent posts from all Telegram sources without OpenAI
        env:
          TELEGRAM_FORCE_RECENT_POSTS: "30"
          DEBUG_TELEGRAM_PARSER: "true"
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectDirectSources } from "./sources.mjs";
          const state = JSON.parse(fs.readFileSync("seen.json","utf8"));
          const r = await collectDirectSources(state);
          console.log("TG_CHANNELS", JSON.stringify(r.stats.telegram_channels));
          console.log("TG_TOTAL", r.stats.telegram_raw_posts_seen);
          console.log("TG_CANDIDATES", r.stats.telegram_candidates);
          console.log("HEALTH", JSON.stringify(r.source_health_warnings));
          console.log("ERRORS", JSON.stringify(r.errors));
          const channels = Object.values(r.stats.telegram_channels || {});
          if (channels.length !== 6) process.exit(2);
          if (channels.some(x => Number(x.raw_posts_seen || 0) < 25)) process.exit(3);
          if (r.source_health_warnings.length) process.exit(4);
          NODE
