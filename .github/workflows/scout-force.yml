name: Car Gem Scout Force Trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".scout-trigger"

permissions:
  actions: write
  contents: write

concurrency:
  group: car-gem-state
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run forced Car Gem Scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_ONLY: "false"
          GITHUB_EVENT_NAME: "workflow_dispatch"
        run: node scout.mjs

      - name: Save scout state
        id: save_state
        if: always()
        run: |
          if git diff --quiet -- seen.json; then
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "state_changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "Car Gem Scout Watchdog"
          git config user.email "car-gem-scout@users.noreply.github.com"
          git add seen.json
          git commit -m "Update Car Gem Scout seen list"
          git pull --rebase origin main
          git push

      - name: Arm next reliable scheduler
        if: always() && steps.save_state.outputs.state_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scout-scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
