name: One-Time Full Car Scout Research

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-full-scout-once.yml"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run comprehensive production scout once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_FORCE_RECENT_POSTS: "100"
          FORCE_DAILY_SWEEP: "true"
          SOURCE_BATCH_LIMIT: "64"
          TEST_ONLY: "false"
          GITHUB_EVENT_NAME: "workflow_dispatch"
        run: node scout.mjs
      - name: Save scout state
        if: always()
        run: |
          if git diff --quiet -- seen.json; then
            exit 0
          fi
          git config user.name "Car Gem Scout"
          git config user.email "car-gem-scout@users.noreply.github.com"
          git add seen.json
          git commit -m "Update Car Gem Scout after full research"
          git pull --rebase origin main
          git push
