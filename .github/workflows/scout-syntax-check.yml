name: Scout Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scout-syntax-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scout.mjs

