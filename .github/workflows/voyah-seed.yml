name: Voyah Free Baseline Sync

on:
  push:
    branches:
      - main
    paths:
      - ".voyah-seed"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
      - name: Sync Voyah Free baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VOYAH_ONLY: "true"
        run: node scout.mjs
      - name: Save Voyah state
        run: |
          if git diff --quiet -- seen.json; then
            echo "No Voyah state changes."
            exit 0
          fi
          git config user.name "Car Gem Scout"
          git config user.email "car-gem-scout@users.noreply.github.com"
          git add seen.json
          git commit -m "Seed Voyah Free watchlist"
          git pull --rebase origin main
          git push origin HEAD:main
