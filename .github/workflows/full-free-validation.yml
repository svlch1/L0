name: Full Scout Free Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/full-free-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
      - name: Force 100 Telegram posts per channel without OpenAI
        env:
          TELEGRAM_FORCE_RECENT_POSTS: "100"
          FORCE_DAILY_SWEEP: "true"
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectDirectSources } from "./sources.mjs";
          const state = JSON.parse(fs.readFileSync("seen.json","utf8"));
          const r = await collectDirectSources(state);
          console.log("TG", JSON.stringify(r.stats.telegram_channels));
          console.log("FORCED", r.stats.forced_recent_posts_per_channel);
          console.log("AUTO", JSON.stringify({
            pages:r.stats.auto_ria_pages_scanned,
            cards:r.stats.auto_ria_raw_cards,
            depth:r.stats.auto_ria_page_depth
          }));
          console.log("POOL", r.pool.length);
          console.log("HEALTH", JSON.stringify(r.source_health_warnings));
          console.log("ERRORS", JSON.stringify(r.errors));
          if ((r.stats.telegram_channels?.kievavto2?.raw_posts_seen || 0) < 100) process.exit(2);
          if ((r.stats.telegram_channels?.isAuto99?.raw_posts_seen || 0) < 100) process.exit(3);
          if (r.source_health_warnings.length) process.exit(4);
          NODE

# rerun-after-telegram-page-budget-fix
