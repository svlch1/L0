name: One-Shot Deep Car Scout

on:
  push:
    branches:
      - main
    paths:
      - ".one-shot-deep-trigger"

permissions:
  contents: write

concurrency:
  group: car-gem-state
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run one-shot deep Car Gem Scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_ONLY: "false"
          GITHUB_EVENT_NAME: "workflow_dispatch"
          IGNORE_SCOUT_PAUSE: "true"
          SOURCE_BATCH_LIMIT: "64"
          DEEP_BATCH_MAX: "10"
          DEEP_BATCH_MIN: "8"
          SOL_AUDIT_LIMIT: "4"
        run: node scout.mjs

      - name: Save scout state
        if: always()
        run: |
          if git diff --quiet -- seen.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "Car Gem Scout Deep One Shot"
          git config user.email "car-gem-scout@users.noreply.github.com"
          git add seen.json
          git commit -m "Update Car Gem Scout seen list"
          git pull --rebase origin main
          git push origin HEAD:main
