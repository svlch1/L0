name: Collector Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collector-smoke.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check production scout
        run: node --check scout.mjs && node --check sources.mjs
