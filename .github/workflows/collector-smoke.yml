name: Collector Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collector-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe public sources without OpenAI
        run: |
          set +e
          for URL in             "https://auto.ria.com/uk/car/bmw/4-series/price/25000/amp/"             "https://auto.ria.com/uk/car/bmw/4-series/price/26500/amp/"             "https://t.me/s/kievavto2"             "https://r.jina.ai/https://auto.ria.com/uk/car/bmw/4-series/price/25000/amp/"             "https://r.jina.ai/https://t.me/s/kievavto2"
          do
            echo "===== $URL ====="
            curl -L --max-time 30 -A "Mozilla/5.0" -sS -o /tmp/body -w "HTTP=%{http_code} SIZE=%{size_download}\n" "$URL"
            head -c 250 /tmp/body | tr '\n' ' '
            echo
          done
