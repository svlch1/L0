name: Final Scout Free Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-free-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
      - name: Collector only, no OpenAI
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectDirectSources } from "./sources.mjs";
          const state = JSON.parse(fs.readFileSync("seen.json", "utf8"));
          const r = await collectDirectSources(state);
          console.log("STATS", JSON.stringify(r.stats));
          console.log("EXPLORATION", JSON.stringify(r.exploration_brands));
          console.log("POOL", r.pool.length);
          console.log("ANOMALIES", r.pool.filter(x => Number(x.price_anomaly_pct || 0) >= 10).slice(0,10).map(x => ({
            url:x.source_url, model:x.model_hint, price:x.price_hint_usd,
            median:x.market_median_hint_usd, anomaly:x.price_anomaly_pct
          })));
          console.log("TG_HIGH_WATER", JSON.stringify(r.telegram_high_water));
          console.log("ERRORS", JSON.stringify(r.errors));
          if (!r.pool.length && !r.price_changed_items.length) process.exit(2);
          NODE
