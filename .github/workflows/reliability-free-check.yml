name: Reliability Free Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reliability-free-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
      - name: Collector only
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectDirectSources } from "./sources.mjs";
          const state = JSON.parse(fs.readFileSync("seen.json", "utf8"));
          const r = await collectDirectSources(state);
          console.log("STATS", JSON.stringify(r.stats));
          console.log("DAILY", r.daily_sweep_performed, r.daily_sweep_day);
          console.log("CURSORS", JSON.stringify(r.telegram_cursors));
          console.log("HEALTH", JSON.stringify(r.source_health_warnings));
          console.log("POOL", r.pool.length, "PRICECHANGED", r.price_changed_items.length);
          if (r.source_health_warnings.length) process.exit(3);
          if (!r.pool.length && !r.price_changed_items.length) process.exit(2);
          NODE
