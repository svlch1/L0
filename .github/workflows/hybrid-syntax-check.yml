name: Hybrid Scout Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hybrid-syntax-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check production files
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
