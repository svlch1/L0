name: Final Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-syntax.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check scout.mjs
          node --check sources.mjs
          node --check api/telegram.js
