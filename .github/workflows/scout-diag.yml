name: Scout Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - ".diag-trigger"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print latest deep analyses
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('seen.json','utf8'));
          const rows = Object.entries(s.market_watch || {})
            .map(([key,x]) => ({key,...x}))
            .filter(x => x.last_analyzed_at)
            .sort((a,b) => String(b.last_analyzed_at).localeCompare(String(a.last_analyzed_at)))
            .slice(0,12)
            .map(x => ({
              model:x.model, year:x.year, price:x.last_analyzed_price_usd || x.last_price_usd,
              mileage:x.mileage_km, score:x.last_score, luna:x.last_luna_score,
              confidence:x.last_confidence_pct, hard_reject:x.hard_reject,
              hard_reject_reason:x.hard_reject_reason, analyzed:x.last_analyzed_at,
              url:x.auto_ria_url || x.telegram_url || x.source_url
            }));
          console.log(JSON.stringify(rows,null,2));
          NODE
