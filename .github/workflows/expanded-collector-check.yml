name: Expanded Collector Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expanded-collector-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and collector smoke
        run: |
          node --check scout.mjs
          node --check sources.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectDirectSources } from "./sources.mjs";
          const state = JSON.parse(fs.readFileSync("seen.json", "utf8"));
          const r = await collectDirectSources(state);
          console.log("STATS", JSON.stringify(r.stats));
          console.log("ERRORS", JSON.stringify(r.errors));
          console.log("ITEMS", JSON.stringify(r.items.slice(0, 20).map(x => ({
            source:x.source, url:x.source_url, price:x.price_hint_usd, mileage:x.mileage_hint_km
          }))));
          if (!r.items.length) process.exit(2);
          NODE
