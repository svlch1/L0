name: Post-Run Scout Diagnostic

on:
  push:
    branches: [main]
    paths: [".postrun-diag-trigger"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('seen.json','utf8'));
          const rows=Object.values(s.market_watch||{})
            .filter(x=>x.last_analyzed_at)
            .sort((a,b)=>String(b.last_analyzed_at).localeCompare(String(a.last_analyzed_at)))
            .slice(0,8)
            .map(x=>({
              model:x.model,year:x.year,price:x.last_analyzed_price_usd||x.last_price_usd,mileage:x.mileage_km,
              final_score:x.last_score,luna_score:x.last_luna_score,confidence:x.last_confidence_pct,
              sol_audited_at:x.sol_audited_at,hard_reject:x.hard_reject,reason:x.hard_reject_reason,
              url:x.auto_ria_url||x.telegram_url||x.source_url
            }));
          console.log(JSON.stringify(rows,null,2));
          NODE
